<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barrio Management | Familias</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/familias.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍👩‍👧‍👦</text></svg>">
</head>

<body>
    <nav>
        <div class="brand" onclick="window.location.href='index.html'" style="cursor:pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Barrio Central
        </div>
        <div class="user-profile" id="userProfile" style="display: none;">
            <span id="userName" style="font-size: 0.875rem; font-weight: 500;"></span>
            <img src="" alt="User" class="user-img" id="userImg">
            <button onclick="handleLogout()" class="btn"
                style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Salir</button>
        </div>
    </nav>

    <div class="container">
        <header class="section-header">
            <div>
                <h1>Familias Activas</h1>
                <p id="viewSubtitle">Lista de familias según el estado de actividad de sus integrantes.</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="exportFamiliesPDF()">Exportar PDF</button>
            </div>
        </header>

        <!-- Filtros -->
        <div class="filters-container">
            <div class="org-filters" id="familyFilters">
                <button class="btn btn-primary" onclick="filterFamilies('all')">Todas</button>
                <button class="btn" onclick="filterFamilies('activas')">Activas</button>
                <button class="btn" onclick="filterFamilies('inactivas')">Inactivas</button>
            </div>
            <input type="text" id="familySearch" class="search-input" placeholder="Buscar familia o miembro..."
                style="margin-top:0.75rem; margin-bottom:0;">
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card" id="statFamilias">
                <div class="stat-value">0</div>
                <div class="stat-label">Total Familias</div>
            </div>
            <div class="stat-card" id="statActivas">
                <div class="stat-value" style="color:var(--success);">0</div>
                <div class="stat-label">Familias Activas</div>
            </div>
            <div class="stat-card" id="statInactivas">
                <div class="stat-value" style="color:var(--danger);">0</div>
                <div class="stat-label">Familias Inactivas</div>
            </div>
            <div class="stat-card" id="statMiembrosActivos">
                <div class="stat-value" style="color:var(--warning);">0</div>
                <div class="stat-label">Miembros Activos</div>
            </div>
        </div>

        <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1rem;">
            <h2 style="font-size:1.125rem; font-weight:700; color:var(--primary);">Listado de Familias</h2>
            <span class="count-badge" id="familyCount">0</span>
        </div>

        <div id="familiesGrid" class="families-grid">
            <!-- Se genera dinámicamente -->
        </div>
    </div>

    <!-- Modal Mover -->
    <div class="modal-overlay" id="modalOverlay" style="display: none;">
        <div class="modal" id="moveModal" style="display: none;">
            <div class="modal-header">
                <h2 id="moveMemberName">Miembro</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <label class="move-label">Mover a la familia:</label>
                <select id="moveTarget" class="move-select"></select>
                <div style="margin-top:1rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
                    <button class="btn btn-primary" onclick="confirmMove()">Mover a esta familia</button>
                    <button class="btn" id="btnRevert" onclick="revertMember()">Volver al apellido (separar)</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/familias.js"></script>

    <div id="printReport" class="print-report" style="display:none;"></div>
</body>

</html>
