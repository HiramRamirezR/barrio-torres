<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barrio Management | Llamamientos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/llamamientos.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
</head>

<body>
    <nav>
        <div class="brand" onclick="window.location.href='index.html'" style="cursor:pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Barrio Central
        </div>
        <div class="user-profile" id="userProfile" style="display: none;">
            <span id="userName" style="font-size: 0.875rem; font-weight: 500;"></span>
            <img src="" alt="User" class="user-img" id="userImg">
            <button onclick="handleLogout()" class="btn"
                style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Salir</button>
        </div>
    </nav>

    <div class="container">
        <header class="section-header">
            <div>
                <h1>Organigrama de Llamamientos</h1>
                <p id="viewSubtitle">Visualización general de asignaciones y disponibilidad.</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openMemberSelector()">Asignar Llamamiento</button>
            </div>
        </header>

        <!-- Filtros de Organización -->
        <div class="filters-container">
            <div class="org-filters" id="orgFilters">
                <button class="btn btn-primary" onclick="filterByOrg('all')">Todos</button>
                <button class="btn tag-ss" onclick="filterByOrg('Soc. Socorro')">Soc. Socorro</button>
                <button class="btn tag-qe" onclick="filterByOrg('Quórum Élderes')">Quórum Élderes</button>
                <button class="btn tag-hhjj" onclick="filterByOrg('HHJJ')">HHJJ</button>
                <button class="btn tag-mmjj" onclick="filterByOrg('MMJJ')">MMJJ</button>
                <button class="btn tag-primaria" onclick="filterByOrg('Primaria')">Primaria</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card" id="statNoCalling">
                <div class="stat-value">0</div>
                <div class="stat-label">Sin Llamamiento</div>
            </div>
            <div class="stat-card" id="statOneCalling">
                <div class="stat-value">0</div>
                <div class="stat-label">Con 1 Llamamiento</div>
            </div>
            <div class="stat-card" id="statMultipleCallings">
                <div class="stat-value">0</div>
                <div class="stat-label">Con >1 Llamamiento</div>
            </div>
        </div>

        <main class="main-layout">
            <!-- Tablero Organizacional Central -->
            <section class="structure-section">
                <div class="section-title">
                    <h2>Tablero de Presidencias</h2>
                    <span class="badge">Estructura Oficial</span>
                </div>
                <div id="organizationGrid" class="org-grid">
                    <!-- Se genera dinámicamente -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="modalOverlay" style="display: none;">
        <!-- Modal para editar llamamientos -->
        <div class="modal" id="callingModal" style="display: none;">
            <div class="modal-header">
                <h2 id="modalMemberName">Miembro</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div id="callingList" class="calling-edit-list">
                    <!-- List of current callings with delete buttons -->
                </div>
                <div class="add-calling-form">
                    <input type="text" id="newCallingInput" placeholder="Nuevo llamamiento (ej: Maestro EH)">
                    <button class="btn btn-primary" onclick="addCalling()">Agregar</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">Cerrar</button>
            </div>
        </div>

        <!-- Modal para seleccionar miembro (cuando se hace clic en "Asignar Llamamiento") -->
        <div class="modal" id="memberSelectorModal" style="display: none;">
            <div class="modal-header">
                <h2>Seleccionar Miembro</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="text" id="memberSearch" class="search-input" placeholder="Buscar miembro..." oninput="filterMemberList()">
                <div id="selectorMemberList" class="selector-member-list">
                    <!-- All active members listed here -->
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/llamamientos.js"></script>
</body>

</html>
